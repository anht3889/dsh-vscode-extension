<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1024" height="1024" viewBox="0 0 1024 1024"
     role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek Harness VS Code extension icon</title>
  <desc id="desc">A blue whale leaping from a code editor, with a Visual Studio Code badge.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20d7ff"/>
      <stop offset="0.22" stop-color="#0b8eff"/>
      <stop offset="0.55" stop-color="#0758e8"/>
      <stop offset="1" stop-color="#05299b"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.18" cy="0.04" r="0.92">
      <stop offset="0" stop-color="#86f7ff" stop-opacity="0.95"/>
      <stop offset="0.24" stop-color="#23c9ff" stop-opacity="0.42"/>
      <stop offset="0.72" stop-color="#1359ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#95f9ff"/>
      <stop offset="0.48" stop-color="#25b9ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#001b7b" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#17346f"/>
      <stop offset="0.34" stop-color="#102653"/>
      <stop offset="1" stop-color="#07153d"/>
    </linearGradient>
    <linearGradient id="panelTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#23498c"/>
      <stop offset="0.55" stop-color="#1d3c78"/>
      <stop offset="1" stop-color="#183268"/>
    </linearGradient>
    <linearGradient id="sidebar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f4383"/>
      <stop offset="1" stop-color="#0a1d4c"/>
    </linearGradient>
    <linearGradient id="whale" x1="0.08" y1="0.02" x2="0.88" y2="0.92">
      <stop offset="0" stop-color="#66efff"/>
      <stop offset="0.18" stop-color="#37bfff"/>
      <stop offset="0.48" stop-color="#2a70ff"/>
      <stop offset="0.82" stop-color="#2248ed"/>
      <stop offset="1" stop-color="#1436c9"/>
    </linearGradient>
    <linearGradient id="whaleHighlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8ffff" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#6feeff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.65" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#d9eaff"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0.85">
      <stop offset="0" stop-color="#83f7ff"/>
      <stop offset="0.36" stop-color="#2ecbff"/>
      <stop offset="0.75" stop-color="#167af5"/>
      <stop offset="1" stop-color="#174cd7"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8ffff"/>
      <stop offset="0.35" stop-color="#72f1ff"/>
      <stop offset="1" stop-color="#1aa8ff"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#fbfdff"/>
      <stop offset="1" stop-color="#deecff"/>
    </linearGradient>
    <linearGradient id="vscodeA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#126bff"/>
      <stop offset="1" stop-color="#064fda"/>
    </linearGradient>
    <linearGradient id="vscodeB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#29d1ff"/>
      <stop offset="1" stop-color="#0a83ef"/>
    </linearGradient>

    <clipPath id="iconClip">
      <rect x="36" y="36" width="952" height="952" rx="164"/>
    </clipPath>

    <filter id="outerShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22" result="blur"/>
      <feOffset in="blur" dx="0" dy="22" result="offsetBlur"/>
      <feFlood flood-color="#00123d" flood-opacity="0.48" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="panelShadow" x="-20%" y="-20%" width="150%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="24" result="blur"/>
      <feOffset in="blur" dx="0" dy="26" result="offsetBlur"/>
      <feFlood flood-color="#001b60" flood-opacity="0.58" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="whaleShadow" x="-25%" y="-25%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="blur"/>
      <feOffset in="blur" dx="0" dy="24" result="offsetBlur"/>
      <feFlood flood-color="#00155f" flood-opacity="0.52" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="badgeShadow" x="-30%" y="-30%" width="170%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="blur"/>
      <feOffset in="blur" dx="0" dy="22" result="offsetBlur"/>
      <feFlood flood-color="#001445" flood-opacity="0.55" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

